[project]
name = "vision-reader"
version = "0.1.0"
description = "为无图像能力的 LLM 提供渐进式视觉细节理解：像素+坐标 → 可读文本（chunk 概览 / 裁剪编码 / OCR / 报告）"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "Pillow>=10.0",
    "easyocr>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
mcp = [
    "mcp>=1.2,<2",
]

[project.scripts]
vision = "vision_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
